spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/novum?useAffectedRows=true&useUnicode=true&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&characterEncoding=utf-8
    username: root
    password: 12345678
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
app:
  s3:
    endpoint: ''
    region: auto
    bucket: ''
    access-key: ''
    secret-key: ''
    public-base-url: ''
    presign-expiry: 10m
    pending-retention: 24h
    cleanup-cron: '0 0 3 * * *'
    cleanup-zone: UTC
    max-file-size: 3145728
